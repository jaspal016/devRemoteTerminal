<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Stream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Auth Modal Overlay */
    #auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(13, 17, 23, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .auth-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    .auth-card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #58a6ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .auth-card input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .auth-card input:focus {
      border-color: #58a6ff;
    }
    .auth-card button {
      width: 100%;
      padding: 10px;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .auth-card button:hover {
      background: #2ea043;
    }
    #auth-error {
      color: #f85149;
      font-size: 0.8rem;
      margin-top: 10px;
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* DOM Terminal Stream Container */
    #terminal {
      flex: 1;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.4;
    }
    #input-line {
      display: flex;
      padding: 8px 12px;
      background: #161b22;
      border-top: 1px solid #30363d;
    }
    #input-line input {
      flex: 1;
      background: transparent;
      border: none;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Password Unlock Modal -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2>Encrypted Terminal Endpoint</h2>
      <input type="password" id="passphrase" placeholder="Enter password to unlock" autofocus />
      <button onclick="unlockAndConnect()">Decrypt & Connect</button>
      <div id="auth-error">Invalid password or decryption failed.</div>
    </div>
  </div>

  <!-- Terminal Display -->
  <div id="terminal"></div>
  <div id="input-line" style="display: none;">
    <input type="text" id="command-input" placeholder="Type a command..." autocomplete="off" />
  </div>

  <script>
    // Replace with your Base64 payload (Salt[16] + IV[12] + Ciphertext)
    const ENCRYPTED_PAYLOAD = "XBiuI6KfEjchMlmRzVGDww==:uz2WFKtGaQwwBMi+:XH8+UCc4qfFzXC20fCJL/VboSuCA6dsCKBDWFZk8M8ChoBOWW+EjpCo=";

    let socket = null;
    const terminalEl = document.getElementById('terminal');
    const inputContainer = document.getElementById('input-line');
    const commandInput = document.getElementById('command-input');

    // Safe Base64 to Uint8Array converter
    // Clean base64 string and apply missing '=' padding if necessary
    function base64ToBytes(base64) {
      // 1. Remove whitespace, newlines, and quotes
      let cleaned = base64.replace(/\s+/g, '').replace(/["']/g, '');
    
      // 2. Fix missing padding chars if length is not a multiple of 4
      const mod = cleaned.length % 4;
      if (mod === 2) {
        cleaned += '==';
      } else if (mod === 3) {
        cleaned += '=';
      } else if (mod === 1) {
        throw new Error("Invalid Base64 string length.");
      }
    
      // 3. Decode binary string into Uint8Array
      const binString = atob(cleaned);
      return Uint8Array.from(binString, (m) => m.codePointAt(0));
    }

    // Decrypt encrypted WebSocket string using Web Crypto API
    async function decryptEndpoint(passphrase, base64Data) {
      const encryptedBytes = base64ToBytes(base64Data);

      if (encryptedBytes.length < 28) {
        throw new Error("Payload too short. Expected Salt (16) + IV (12) + Ciphertext.");
      }

      // Exact slice offsets
      const salt = encryptedBytes.subarray(0, 16);
      const iv = encryptedBytes.subarray(16, 28);
      const ciphertext = encryptedBytes.subarray(28);

      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", 
        encoder.encode(passphrase), 
        "PBKDF2", 
        false, 
        ["deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decryptedBuffer = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ciphertext
      );

      return new TextDecoder().decode(decryptedBuffer);
    }

    async function unlockAndConnect() {
      const password = document.getElementById('passphrase').value;
      const errorEl = document.getElementById('auth-error');
      errorEl.style.display = 'none';

      try {
        const wsUrl = await decryptEndpoint(password, ENCRYPTED_PAYLOAD);
        document.getElementById('auth-overlay').style.display = 'none';
        inputContainer.style.display = 'flex';
        initWebSocket(wsUrl);
      } catch (e) {
        console.error("Decryption Error:", e);
        errorEl.innerText = e.message || "Invalid password or payload corrupted.";
        errorEl.style.display = 'block';
      }
    }

    function stripAnsiCodes(str) {
      return str.replace(/[\u001b\u009b][\[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g, '');
    }

    function initWebSocket(wsUrl) {
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        appendLog('\n--- Connected to stream ---\n');
        commandInput.focus();
      };

      socket.onmessage = (event) => {
        const cleanData = stripAnsiCodes(event.data);
        appendLog(cleanData);
      };

      socket.onclose = () => {
        appendLog('\n--- [Connection closed] ---\n');
      };

      socket.onerror = (err) => {
        console.error('WebSocket Error:', err);
      };

      commandInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = commandInput.value + '\n';
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(val);
          }
          commandInput.value = '';
        }
      });
    }

    function appendLog(text) {
      terminalEl.textContent += text;
      terminalEl.scrollTop = terminalEl.scrollHeight;
    }

    document.getElementById('passphrase').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        unlockAndConnect();
      }
    });
  </script>
</body>
</html>
