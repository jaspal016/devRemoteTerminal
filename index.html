<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Access</title>
  
  <!-- xterm.js Stylesheet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Auth Modal Overlay */
    #auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(13, 17, 23, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .auth-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    .auth-card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #58a6ff;
    }
    .auth-card input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .auth-card input:focus {
      border-color: #58a6ff;
    }
    .auth-card button {
      width: 100%;
      padding: 10px;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-card button:hover {
      background: #2ea043;
    }
    #auth-error {
      color: #f85149;
      font-size: 0.8rem;
      margin-top: 10px;
      display: none;
    }
    /* Terminal Container */
    #terminal-container {
      width: 100vw;
      height: 100vh;
      background: #0d1117;
      padding: 4px;
    }
  </style>
</head>
<body>

  <!-- Password Unlock Modal -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2>Encrypted Terminal Endpoint</h2>
      <input type="password" id="passphrase" placeholder="Enter password to unlock" autofocus />
      <button onclick="unlockAndConnect()">Decrypt & Connect</button>
      <div id="auth-error">Invalid password or payload corrupted.</div>
    </div>
  </div>

  <!-- Terminal Screen -->
  <div id="terminal-container"></div>

  <!-- xterm.js Core & Addons -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

  <script>
    // HARDCODED ENCRYPTED PAYLOAD (Generated via PBKDF2 + AES-GCM)
    // Format: Base64 string containing Salt + IV + Ciphertext
    const ENCRYPTED_PAYLOAD = "REPLACE_WITH_YOUR_BASE64_ENCRYPTED_ENDPOINT_STRING";

    let socket = null;
    let term = null;
    let fitAddon = null;

    // Web Crypto API Decryption Helper (PBKDF2 + AES-GCM)
    async function decryptEndpoint(passphrase, base64Data) {
      const encryptedBytes = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
      
      // Extract Salt (16 bytes), IV (12 bytes), Ciphertext
      const salt = encryptedBytes.slice(0, 16);
      const iv = encryptedBytes.slice(16, 28);
      const ciphertext = encryptedBytes.slice(28);

      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", 
        encoder.encode(passphrase), 
        "PBKDF2", 
        false, 
        ["deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decryptedBuffer = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ciphertext
      );

      return new TextDecoder().decode(decryptedBuffer);
    }

    async function unlockAndConnect() {
      const password = document.getElementById('passphrase').value;
      const errorEl = document.getElementById('auth-error');
      errorEl.style.display = 'none';

      try {
        const wsUrl = await decryptEndpoint(password, ENCRYPTED_PAYLOAD);
        document.getElementById('auth-overlay').style.display = 'none';
        initTerminal(wsUrl);
      } catch (e) {
        errorEl.style.display = 'block';
      }
    }

    function initTerminal(wsUrl) {
      // 1. Setup xterm instance
      term = new Terminal({
        cursorBlink: true,
        convertEol: true,
        fontFamily: 'Menlo, Monaco, "Courier New", monospace',
        fontSize: 14,
        theme: {
          background: '#0d1117',
          foreground: '#c9d1d9'
        }
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      const container = document.getElementById('terminal-container');
      term.open(container);

      // 2. Open WebSocket Stream
      socket = new WebSocket(wsUrl);

      function sendResizePayload() {
        fitAddon.fit();
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: 'resize',
            cols: term.cols,
            rows: term.rows
          }));
        }
      }

      socket.onopen = () => {
        sendResizePayload();
      };

      // Direct raw binary stream write to handle escape codes
      socket.onmessage = (event) => {
        term.write(event.data);
      };

      socket.onclose = () => {
        term.write('\r\n\x1b[31m[Connection closed]\x1b[0m\r\n');
      };

      socket.onerror = (err) => {
        console.error('WebSocket Error:', err);
      };

      // Stream user keypresses without local echo
      term.onData((data) => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(data);
        }
      });

      // Keep dimensions in sync with window/container changes
      const resizeObserver = new ResizeObserver(() => {
        sendResizePayload();
      });
      resizeObserver.observe(container);
    }

    // Allow pressing "Enter" key in the password input
    document.getElementById('passphrase').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        unlockAndConnect();
      }
    });
  </script>
</body>
</html>
